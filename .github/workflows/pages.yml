name: Validate and publish learning atlas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-browser-test.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/generate.py
      - run: python scripts/execute.py --write
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - run: python -m pip install -r requirements-browser-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_ui_repairs.py
      - run: python scripts/test_browser.py
      - run: python scripts/check_runtime.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
