<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Empathy and iterative experimentation</title><desc id="desc">Listen, frame, prototype and learn, with feedback returning to listening. Affected people can challenge and change the experiment.</desc><defs><linearGradient id="sea" x2="1" y2="1"><stop stop-color="#13575a"/><stop offset="1" stop-color="#0b3541"/></linearGradient><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f4f5ea"/><stop offset="1" stop-color="#dfece3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#217a6d"/></marker></defs><g font-family="system-ui, sans-serif"><rect width="960" height="430" rx="20" fill="#f5f4ed"/><text x="35" y="48" font-size="26" fill="#153740">Empathy changes the experiment.</text><circle cx="55" cy="119" r="24" fill="#116c61"/><text x="55" y="125" text-anchor="middle" font-size="17" fill="#fff">1</text><text x="30" y="185" font-size="18" fill="#153740">LISTEN</text><text x="30" y="220" font-size="13" fill="#53676b">Whose experience is missing?</text><path d="M94 119H235" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="290" cy="119" r="24" fill="#116c61"/><text x="290" y="125" text-anchor="middle" font-size="17" fill="#fff">2</text><text x="265" y="185" font-size="18" fill="#153740">FRAME</text><text x="265" y="220" font-size="13" fill="#53676b">Name a shared question.</text><path d="M329 119H470" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="525" cy="119" r="24" fill="#116c61"/><text x="525" y="125" text-anchor="middle" font-size="17" fill="#fff">3</text><text x="500" y="185" font-size="18" fill="#153740">PROTOTYPE</text><text x="500" y="220" font-size="13" fill="#53676b">Try one reversible change.</text><path d="M564 119H705" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="760" cy="119" r="24" fill="#116c61"/><text x="760" y="125" text-anchor="middle" font-size="17" fill="#fff">4</text><text x="735" y="185" font-size="18" fill="#153740">LEARN</text><text x="735" y="220" font-size="13" fill="#53676b">Invite critique and revise.</text><path d="M859 251V302H56V251" fill="none" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><text x="237" y="289" font-size="15" fill="#116c61">Record disagreement. Share authority. Change course when needed.</text><text x="35" y="364" font-size="15" fill="#53676b">Original interpretation informed by IDEO.org Design Kit and WHO AI governance.</text></g></svg>
