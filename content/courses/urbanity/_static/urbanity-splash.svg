<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Urbanity: cities as connected systems</title>
  <desc id="desc">An original illustration of city blocks and streets transforming into a network graph.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#10263b"/><stop offset="1" stop-color="#1d4960"/>
    </linearGradient>
    <pattern id="grid" width="72" height="64" patternUnits="userSpaceOnUse" patternTransform="skewY(-18)">
      <rect x="7" y="7" width="46" height="38" rx="5" fill="#f3b35c"/>
      <rect x="16" y="15" width="28" height="22" rx="3" fill="#fae2ad"/>
      <path d="M0 56h72M63 0v64" stroke="#73d9cf" stroke-width="9"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#061421" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="30" fill="url(#sky)"/>
  <circle cx="1025" cy="84" r="47" fill="#ffcc7b" opacity=".92"/>
  <path d="M0 331 1200 212v228H0Z" fill="#153247"/>
  <path d="M43 280 593 171l271 75-548 112Z" fill="url(#grid)" stroke="#bcebe4" stroke-width="3" filter="url(#shadow)"/>
  <g fill="#fff" opacity=".94" font-family="system-ui,Segoe UI,sans-serif">
    <text x="54" y="82" font-size="17" font-weight="700" letter-spacing="4">A VISUAL FIELD GUIDE</text>
    <text x="52" y="144" font-size="46" font-weight="760">Cities are more than streets.</text>
    <text x="55" y="181" font-size="19">Urban networks connect buildings, places, movement, and people.</text>
    <text x="890" y="309" font-size="15" font-weight="700" letter-spacing="2">A CITY, AS A GRAPH</text>
  </g>
  <g fill="none" stroke="#68ddd0" stroke-width="4" opacity=".85">
    <path d="M736 259 898 257l73-48 109 55-95 67-87-21-83 42"/>
    <path d="m898 257 51 77m22-125 14 122m95-67-88 12"/>
  </g>
  <g fill="#ffb454" stroke="#10263b" stroke-width="5">
    <circle cx="736" cy="259" r="10"/><circle cx="898" cy="257" r="10"/><circle cx="971" cy="209" r="10"/>
    <circle cx="1080" cy="264" r="10"/><circle cx="985" cy="331" r="10"/><circle cx="898" cy="310" r="10"/>
    <circle cx="815" cy="352" r="10"/>
  </g>
  <path d="M55 386h362" stroke="#ffb454" stroke-width="4" stroke-linecap="round"/>
</svg>
