<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Evidence to action and back to learning</title><desc id="desc">Question, evidence, analysis, review and action form a learning loop. Community review and privacy precede accountable action.</desc><defs><linearGradient id="sea" x2="1" y2="1"><stop stop-color="#13575a"/><stop offset="1" stop-color="#0b3541"/></linearGradient><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f4f5ea"/><stop offset="1" stop-color="#dfece3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#217a6d"/></marker></defs><g font-family="system-ui, sans-serif"><rect width="960" height="480" rx="20" fill="#f3f5ec"/><text x="35" y="48" font-size="25" fill="#153740">Evidence becomes useful through accountable review.</text><rect x="28" y="110" width="166" height="135" rx="12" fill="#dcebe0" stroke="#7ea98e"/><text x="44" y="151" font-size="13" font-weight="650" fill="#153740">QUESTION</text><text x="44" y="186" font-size="11" fill="#153740">Who is affected?</text><text x="44" y="222" font-size="22" fill="#217a6d">01</text><path d="M197 176H213" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="216" y="110" width="166" height="135" rx="12" fill="#dcebe0" stroke="#7ea98e"/><text x="232" y="151" font-size="13" font-weight="650" fill="#153740">EVIDENCE</text><text x="232" y="186" font-size="11" fill="#153740">Origin · date · units</text><text x="232" y="222" font-size="22" fill="#217a6d">02</text><path d="M385 176H401" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="404" y="110" width="166" height="135" rx="12" fill="#dcebe0" stroke="#7ea98e"/><text x="420" y="151" font-size="13" font-weight="650" fill="#153740">ANALYSIS</text><text x="420" y="186" font-size="11" fill="#153740">Assumptions · limits</text><text x="420" y="222" font-size="22" fill="#217a6d">03</text><path d="M573 176H589" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="592" y="110" width="166" height="135" rx="12" fill="#f6d48f" stroke="#7ea98e"/><text x="608" y="151" font-size="13" font-weight="650" fill="#153740">REVIEW</text><text x="608" y="186" font-size="11" fill="#153740">Privacy · community</text><text x="608" y="222" font-size="22" fill="#217a6d">04</text><path d="M761 176H777" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="110" width="166" height="135" rx="12" fill="#dcebe0" stroke="#7ea98e"/><text x="796" y="151" font-size="13" font-weight="650" fill="#153740">ACTION</text><text x="796" y="186" font-size="11" fill="#153740">Owner · stopping rule</text><text x="796" y="222" font-size="22" fill="#217a6d">05</text><path d="M863 260V322H110V260" fill="none" stroke="#217a6d" stroke-width="2" marker-end="url(#arrow)"/><text x="290" y="310" font-size="16" fill="#116c61">Listen · measure consequences · revise the next question</text><text x="35" y="389" font-size="17" fill="#153740">A persuasive map, a prediction and a causal claim need different evidence.</text><text x="35" y="424" font-size="14" fill="#53676b">Synthetic teaching results are not observed health effects or validated policy advice.</text></g></svg>
