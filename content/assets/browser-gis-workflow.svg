<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Carry evidence from a notebook into browser GIS</title>
<desc id="desc">Inspect a source and select known feature IDs in a notebook. Download GeoJSON, method and review files. Import explicitly into RustGIS or GeoLibre. Check values with a human and revise the question. Optional AI proposes interpretations; the evidence checks remain human responsibilities.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#19786e"/></marker></defs>
<rect width="960" height="400" rx="20" fill="#f5f5ef"/>
<g font-family="sans-serif" fill="#123c45"><text x="32" y="42" font-size="24" font-weight="700">One result. Two GIS apps. Visible evidence.</text>
<g stroke="#19786e" stroke-width="2" fill="#fff"><rect x="30" y="90" width="205" height="172" rx="12"/><rect x="270" y="90" width="185" height="172" rx="12"/><rect x="490" y="90" width="205" height="172" rx="12"/><rect x="730" y="90" width="200" height="172" rx="12"/></g>
<g font-size="18" font-weight="700"><text x="48" y="120">1 &#183; Inspect + select</text><text x="288" y="120">2 &#183; Download</text><text x="508" y="120">3 &#183; Import locally</text><text x="748" y="120">4 &#183; Human review</text></g>
<g font-size="15"><text x="48" y="153">Notebook / Lab</text><text x="48" y="183">Source, rights, units</text><text x="48" y="208">Dates, nulls, stable IDs</text><text x="48" y="237">Explicit small selection</text><text x="288" y="157">GeoJSON</text><text x="288" y="186">Method + SHA-256</text><text x="288" y="215">Review instructions</text><text x="508" y="157">RustGIS or GeoLibre</text><text x="508" y="186">Separate app / tab</text><text x="508" y="215">Check count + extent</text><text x="748" y="157">Compare ID + value</text><text x="748" y="186">Question the claim</text><text x="748" y="215">Revise one choice</text></g>
<g stroke="#19786e" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M237 176h26"/><path d="M457 176h26"/><path d="M697 176h26"/><path d="M830 273v37H130v-37"/></g>
<text x="260" y="338" font-size="16">Save changes separately; upload back to Lab by choice.</text><text x="32" y="376" font-size="15">AI is optional. A map, a model suggestion and verified evidence are different things.</text></g></svg>
