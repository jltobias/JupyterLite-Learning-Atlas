<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">Browser capabilities and continuation paths</title><desc id="desc">Three browser learning activities connect to separate native GIS, GPU and model services. Default exercises are small, synthetic and credential-free.</desc><defs><linearGradient id="sea" x2="1" y2="1"><stop stop-color="#13575a"/><stop offset="1" stop-color="#0b3541"/></linearGradient><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f4f5ea"/><stop offset="1" stop-color="#dfece3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#217a6d"/></marker></defs><g font-family="system-ui, sans-serif"><rect width="960" height="400" rx="20" fill="#f5f4ed"/><text x="32" y="48" font-size="25" fill="#153740">Start small. Know where each tool runs.</text><rect x="32" y="82" width="280" height="182" rx="14" fill="#e4eee5" stroke="#c4d1c5"/><text x="52" y="116" font-size="11" letter-spacing="1.3" fill="#116c61">BROWSER NOTEBOOKS</text><text x="52" y="164" font-size="18" fill="#153740">Small, inspectable Python</text><text x="52" y="196" font-size="13" fill="#53676b">Stdlib + local SVG output</text><text x="52" y="235" font-size="13" fill="#153740">Predict → run → interpret</text><rect x="334" y="82" width="280" height="182" rx="14" fill="#f5e5bf" stroke="#c4d1c5"/><text x="354" y="116" font-size="11" letter-spacing="1.3" fill="#116c61">VISUAL EXPLORATION</text><text x="354" y="164" font-size="18" fill="#153740">2D, extrusions and scenes</text><text x="354" y="196" font-size="13" fill="#53676b">Assumptions stay visible</text><text x="354" y="235" font-size="13" fill="#153740">Predict → run → interpret</text><rect x="636" y="82" width="280" height="182" rx="14" fill="#e5e5f0" stroke="#c4d1c5"/><text x="656" y="116" font-size="11" letter-spacing="1.3" fill="#116c61">HUMAN REVIEW</text><text x="656" y="164" font-size="18" fill="#153740">Sources, privacy and empathy</text><text x="656" y="196" font-size="13" fill="#53676b">Learn through participation</text><text x="656" y="235" font-size="13" fill="#153740">Predict → run → interpret</text><path d="M35 294H925" stroke="#c4d1c5"/><text x="35" y="327" font-size="16" fill="#153740">Continue separately: native GIS · GPU inference · authenticated model services</text><text x="35" y="358" font-size="13" fill="#53676b">First browser load needs network. Default exercises need no credentials or remote datasets.</text></g></svg>
